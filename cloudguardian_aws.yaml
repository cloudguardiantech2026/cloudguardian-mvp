AWSTemplateFormatVersion: '2010-09-09'
Description: 'Creates a secure, read-only IAM role that allows CloudGuardian to perform Cyber Essentials compliance scans against your AWS account. No access keys are created.'

Parameters:

  CloudGuardianExternalId:
    Type: String
    Description: 'Your unique CloudGuardian customer ID. Pre-filled automatically - do not change.'

Resources:

  CloudGuardianAuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudGuardian-ReadOnly-AuditRole
      Description: Read-only role for CloudGuardian Cyber Essentials compliance scanning
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::968477811670:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref CloudGuardianExternalId
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/SecurityAudit'
        - 'arn:aws:iam::aws:policy/ReadOnlyAccess'
      Tags:
        - Key: CreatedBy
          Value: CloudGuardian
        - Key: Purpose
          Value: CyberEssentialsComplianceScanning

Outputs:

  RoleArn:
    Description: 'Copy this value and paste it into the CloudGuardian AWS Connection screen'
    Value: !GetAtt CloudGuardianAuditRole.Arn
    Export:
      Name: CloudGuardianAuditRoleArn
